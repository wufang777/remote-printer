services:
  relay:
    build:
      context: ./app
      dockerfile: deploy/linux/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 17880
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
    volumes:
      - relay-data:/app/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      PRINT_DOMAIN: ${PRINT_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - relay
    restart: unless-stopped

volumes:
  relay-data:
  caddy-data:
  caddy-config:
