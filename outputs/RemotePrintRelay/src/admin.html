<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>远程打印管理后台</title><style>body{font:16px -apple-system,"PingFang SC";background:#eef7ff;color:#071b38}main{max-width:1100px;margin:30px auto;background:#fff;padding:28px;border-radius:20px}input,button,select{padding:10px;margin:4px;border-radius:8px;border:1px solid #b7d5ef}button{background:#1387ff;font-weight:bold}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #dbeafa;text-align:left}.hide{display:none}</style><main><section id="login"><h1>远程打印管理后台</h1><input id="token" type="password" placeholder="管理员帐号密码 / ADMIN_API_TOKEN"><button onclick="go()">登录</button></section><section id="panel" class="hide"><h1>注册码管理</h1><input id="label" placeholder="名称"><input id="count" type="number" value="1" min="1" max="100"><input id="expires" type="date"><select id="reusable"><option value="false">一次性</option><option value="true">可重复使用</option></select><button onclick="createCodes()">批量生成</button><button onclick="load()">刷新</button><h2>注册码</h2><table><tbody id="rows"></tbody></table><h2>设备</h2><table><tbody id="devices"></tbody></table><h2>最近任务</h2><table><tbody id="jobs"></tbody></table></section></main><script>let key='';const h=()=>({Authorization:'Bearer '+key,'Content-Type':'application/json'});async function go(){key=token.value;let r=await fetch('/admin/activation-codes',{headers:h()});if(!r.ok)return alert('管理员帐号密码无效');login.classList.add('hide');panel.classList.remove('hide');load()}async function load(){let[a,b,c]=await Promise.all(['activation-codes','devices','jobs'].map(x=>fetch('/admin/'+x,{headers:h()}).then(x=>x.json())));rows.innerHTML=a.codes.map(x=>`<tr><td>${x.code} <button onclick="navigator.clipboard.writeText('${x.code}')">复制</button></td><td>${x.label||'-'}</td><td>${x.disabled?'禁用':'可用'}</td><td>${x.createdAt}<br>${x.expiresAt||'-'}</td><td><button onclick="toggle('${x.code}',${x.disabled})">${x.disabled?'启用':'禁用'}</button></td></tr>`).join('');devices.innerHTML=b.devices.map(x=>`<tr><td>${x.deviceName}</td><td>${x.deviceId} <button onclick="navigator.clipboard.writeText('${x.deviceId}')">复制</button></td></tr>`).join('');jobs.innerHTML=c.jobs.map(x=>`<tr><td>${x.file.fileName}</td><td>${x.status}</td><td>${x.createdAt}</td></tr>`).join('')}async function createCodes(){await fetch('/admin/activation-codes/batch',{method:'POST',headers:h(),body:JSON.stringify({label:label.value,count:count.value,expiresAt:expires.value||null,reusable:reusable.value==='true'})});load()}async function toggle(c,d){await fetch('/admin/activation-codes/'+c+'/'+(d?'enable':'disable'),{method:'POST',headers:h()});load()}</script></html>
