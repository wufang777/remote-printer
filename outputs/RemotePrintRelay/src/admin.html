<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>远程打印管理后台</title><style>body{font:16px -apple-system,"PingFang SC";background:#eef7ff;color:#071b38}main{max-width:1100px;margin:30px auto;background:#fff;padding:28px;border-radius:20px}input,button,select{padding:10px;margin:4px;border-radius:8px;border:1px solid #b7d5ef}button{background:#1387ff;font-weight:bold}.hide{display:none}table{width:100%;border-collapse:collapse}td{padding:8px;border-bottom:1px solid #dbeafa}.card{background:#f5faff;padding:12px;border-radius:10px;margin:12px 0}</style><main><section id="login"><h1>远程打印管理后台</h1><input id="username" placeholder="管理员帐号"><input id="password" type="password" placeholder="管理员密码"><button onclick="go()">登录</button></section><section id="panel" class="hide"><button onclick="show('codes')">注册码管理</button><button onclick="show('settings')">设置</button><section id="codes"><div class="card"><input id="label" placeholder="客户名称"><input id="count" type="number" value="1"><button onclick="createCodes()">批量生成</button><input id="query" placeholder="查询注册码或客户"><button onclick="search()">查询</button></div><table id="rows"></table><button id="prev" onclick="move(-1)">上一页</button><span id="pageInfo"></span><button id="next" onclick="move(1)">下一页</button><h2>在线设备</h2><table id="devices"></table><h2>最近打印任务</h2><table id="jobs"></table></section><section id="settings" class="hide"><div class="card"><h2>注册码生成密钥</h2><p id="tokenStatus"></p><input id="activationToken" type="password" placeholder="输入新的 ADMIN_API_TOKEN"><button onclick="saveToken()">保存并启用</button></div><div class="card"><h2>注册码列表方式</h2><label>每页 <select id="pageSize"><option>5</option><option>10</option><option>20</option><option>50</option><option>100</option></select> 条</label><label>显示 <select id="listFilter"><option value="active">全部有效</option><option value="enabled">仅启用</option><option value="disabled">仅禁用</option><option value="deleted">已删除</option></select></label><label>排序 <select id="listSort"><option value="created_desc">最新优先</option><option value="created_asc">最早优先</option><option value="customer">按客户</option></select></label><button onclick="saveSettings()">保存设置</button></div></section></section></main><script>let auth='',page=1,s={pageSize:20,listFilter:'active',listSort:'created_desc'};let h=()=>({Authorization:auth,'Content-Type':'application/json'});async function go(){auth='Basic '+btoa(username.value+':'+password.value);if(!(await fetch('/admin/settings',{headers:h()})).ok)return alert('帐号或密码无效');login.classList.add('hide');panel.classList.remove('hide');await settingsLoad();load()}function show(x){codes.classList.toggle('hide',x!=='codes');settings.classList.toggle('hide',x!=='settings')}async function settingsLoad(){s=await fetch('/admin/settings',{headers:h()}).then(r=>r.json());tokenStatus.textContent=s.configured?`已启用（密钥版本 ${s.keyVersion}）`:'尚未设置 ADMIN_API_TOKEN';pageSize.value=s.pageSize;listFilter.value=s.listFilter;listSort.value=s.listSort}async function load(){let q=encodeURIComponent(query.value||''),[a,d,j]=await Promise.all([fetch(`/admin/activation-codes?page=${page}&pageSize=${s.pageSize}&query=${q}&filter=${s.listFilter}&sort=${s.listSort}`,{headers:h()}).then(r=>r.json()),fetch('/admin/devices',{headers:h()}).then(r=>r.json()),fetch('/admin/jobs',{headers:h()}).then(r=>r.json())]);rows.innerHTML=a.codes.map(x=>`<tr><td>${x.code}</td><td>${x.label||'-'}</td><td>${x.deletedAt?'已删除':x.disabled?'禁用':'启用'}</td><td><button onclick="toggle('${x.code}',${x.disabled})">${x.disabled?'启用':'禁用'}</button><button onclick="del('${x.code}')">删除</button></td></tr>`).join('')||'<tr><td>没有记录</td></tr>';devices.innerHTML=d.devices.map(x=>`<tr><td>${x.deviceName}</td><td>${x.deviceId}</td></tr>`).join('')||'<tr><td>暂无在线设备</td></tr>';jobs.innerHTML=j.jobs.map(x=>`<tr><td>${x.file.fileName}</td><td>${x.status}</td><td>${x.createdAt}</td></tr>`).join('')||'<tr><td>暂无打印任务</td></tr>';pageInfo.textContent=`第 ${a.page} 页 / 共 ${a.total} 条`;prev.disabled=a.page<=1;next.disabled=a.page*a.pageSize>=a.total}function search(){page=1;load()}function move(n){page+=n;load()}async function saveToken(){await fetch('/admin/settings/activation-token',{method:'PUT',headers:h(),body:JSON.stringify({token:activationToken.value})});activationToken.value='';settingsLoad()}async function saveSettings(){await fetch('/admin/settings',{method:'PATCH',headers:h(),body:JSON.stringify({pageSize:pageSize.value,listFilter:listFilter.value,listSort:listSort.value})});page=1;await settingsLoad();load()}async function createCodes(){await fetch('/admin/activation-codes/batch',{method:'POST',headers:h(),body:JSON.stringify({label:label.value,count:count.value})});load()}async function toggle(c,d){await fetch('/admin/activation-codes/'+c+'/'+(d?'enable':'disable'),{method:'POST',headers:h()});load()}async function del(c){if(confirm('确认删除？')){await fetch('/admin/activation-codes/'+c,{method:'DELETE',headers:h()});load()}}</script></html>
